<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Population vs EV</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{margin:0;font-family:Arial;background:#08111f;color:#fff}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#0f172a;border:1px solid #1f2937;border-radius:18px;padding:18px}select,button{padding:12px;border-radius:10px;background:#111827;color:#fff;border:1px solid #334155}button{background:#14b8a6;color:#03201d;font-weight:700;border:0}a{color:#5eead4}</style></head><body><div class="wrap"><a href="/">← Back</a><h1>Population vs EV Stations</h1><div class="card"><select id="stateFilter"><option value="">Select State</option></select><button id="loadBtn">Generate Chart</button><canvas id="chart" height="120"></canvas></div></div><script>let chart;async function loadStates(){const r=await fetch('/api/states');const s=await r.json();s.sort().forEach(x=>stateFilter.innerHTML+=`<option>${x}</option>`)}async function loadChart(){const state=stateFilter.value;if(!state)return alert('Select state');const r=await fetch('/api/population-vs-ev?state='+encodeURIComponent(state));const data=await r.json();const labels=data.map(x=>x.district);const ev=data.map(x=>x.ev_stations);const pop=data.map(x=>x.population);if(chart)chart.destroy();chart=new Chart(document.getElementById('chart'),{type:'bar',data:{labels,datasets:[{label:'EV Stations',data:ev},{label:'Population',data:pop,yAxisID:'y1'}]},options:{responsive:true,scales:{y:{beginAtZero:true},y1:{beginAtZero:true,position:'right',grid:{drawOnChartArea:false}}}}})}loadBtn.onclick=loadChart;loadStates();</script></body></html>
